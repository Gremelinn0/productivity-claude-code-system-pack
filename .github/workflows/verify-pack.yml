name: Vérification du Claude Code System Pack
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contrats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML==6.0.3
      - name: Faux positifs YAML
        run: python scripts/verifier_pack.py --self-test
      - name: Inventaire (auto-test)
        run: python skills/skill-cleaner/scripts/inventaire.py --self-test
      - name: Contrats et références du pack
        run: python scripts/verifier_pack.py
      - name: Capitalisation - preuves mécaniques
        run: python -m unittest discover -s skills/capitaliser/tests -v
      - name: Capitalisation - contrat documentaire
        run: python skills/capitaliser/scripts/verifier_contrat.py skills/capitaliser
      - name: Inventaire du pack
        run: python skills/skill-cleaner/scripts/inventaire.py skills --json > /tmp/skills-inventaire.json
